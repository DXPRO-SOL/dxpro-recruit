<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採用チャット管理 - DXPRO SOLUTIONS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .msg-actions { display: none; }
    .msg-wrap:hover .msg-actions { display: flex; }
  </style>
<body class="bg-gray-50 font-['Noto_Sans_JP'] min-h-screen">

  <div class="flex h-screen overflow-hidden">

    <!-- 左: チャットルーム一覧 -->
    <aside class="w-80 bg-white border-r border-gray-100 flex flex-col">
      <div class="bg-gradient-to-r from-[#0b2447] to-[#12395e] text-white px-5 py-4">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="font-bold text-base">採用チャット</h1>
            <p class="text-white/60 text-xs mt-0.5">応募者との連絡</p>
          </div>
          <a href="/index.html" class="text-white/60 hover:text-white text-xs">
            <i class="fas fa-home"></i>
          </a>
        </div>
      </div>

      <div class="px-4 py-3 border-b border-gray-100">
        <input id="searchInput" type="text" placeholder="応募IDで検索..." 
          class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200">
      </div>

      <div id="roomList" class="flex-1 overflow-y-auto divide-y divide-gray-50">
        <div class="text-center text-gray-400 text-sm py-10">読み込み中...</div>
      </div>
    </aside>

    <!-- 右: チャット画面 -->
    <div class="flex-1 flex flex-col">

      <!-- チャットヘッダー -->
      <div id="chatHeader" class="bg-white border-b border-gray-100 px-6 py-4 flex items-center gap-3 shadow-sm">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <i class="fas fa-user text-blue-700 text-sm"></i>
        </div>
        <div>
          <p class="font-semibold text-gray-900 text-sm" id="chatTitle">応募を選択してください</p>
          <p class="text-gray-400 text-xs" id="chatSubtitle">左のリストから応募者を選んでください</p>
        </div>
      </div>

      <!-- メッセージエリア -->
      <main id="messagesArea" class="flex-1 overflow-y-auto px-6 py-5 space-y-3 bg-gray-50">
        <div class="flex flex-col items-center justify-center h-full text-gray-400">
          <i class="fas fa-comments text-6xl mb-4 text-gray-300"></i>
          <p class="text-sm">応募者を選択してチャットを開始</p>
        </div>
      </main>

      <!-- 入力エリア -->
      <div class="bg-white border-t border-gray-100 px-6 py-4">
        <div id="filePreviewBar" class="hidden mb-2 bg-blue-50 rounded-xl px-4 py-2 flex items-center gap-3 text-sm text-blue-700">
          <i class="fas fa-paperclip"></i>
          <span id="filePreviewName" class="flex-1 truncate"></span>
          <button onclick="clearFile()" class="text-blue-400 hover:text-blue-700"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex gap-3 items-center">
          <label for="fileInput" class="cursor-pointer text-gray-400 hover:text-blue-600 transition-colors" title="ファイルを添付">
            <i class="fas fa-paperclip text-lg"></i>
          </label>
          <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
          <input id="msgInput" type="text" placeholder="返信メッセージを入力..." disabled
            class="flex-1 border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 disabled:bg-gray-50">
          <button onclick="sendMessage()" id="sendBtn" disabled
            class="bg-blue-700 text-white px-6 py-2.5 rounded-full font-medium text-sm hover:bg-blue-800 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center gap-2">
            <i class="fas fa-paper-plane"></i> 送信
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl">
      <h3 class="font-semibold text-gray-800 mb-3">メッセージを編集</h3>
      <input id="editInput" type="text" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200">
      <div class="flex gap-2 mt-4">
        <button onclick="closeEdit()" class="flex-1 border border-gray-200 text-gray-600 rounded-xl py-2 text-sm hover:bg-gray-50">キャンセル</button>
        <button onclick="submitEdit()" class="flex-1 bg-blue-700 text-white rounded-xl py-2 text-sm hover:bg-blue-800">保存</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let me = null;
    let currentRoom = null;
    let currentType = null;
    let pendingFile = null;
    let editingMessageId = null;
    const positionMap = {
      frontend: "フロントエンドエンジニア", backend: "バックエンドエンジニア",
      designer: "UIデザイナー", pm: "プロジェクトマネージャー",
      consultant: "ITコンサルタント", qaengineer: "QAエンジニア"
    };
    const typeMap = { newgrad: "新卒", career: "中途" };

    async function init() {
      const meRes = await fetch("/api/me");
      if (!meRes.ok) { location.href = "/login.html"; return; }
      me = await meRes.json();
      if (me.role !== "admin") { location.href = "/index.html"; return; }
      await loadRooms();
    }

    async function loadRooms() {
      const list = document.getElementById("roomList");
      list.innerHTML = `<div class="text-center text-gray-400 text-sm py-6">読み込み中...</div>`;

      try {
        // チャット済みルームと全応募一覧を並行取得
        const [roomsRes, appsRes] = await Promise.all([
          fetch("/api/chat-rooms"),
          fetch("/api/admin/all-applications")
        ]);
        const rooms = await roomsRes.json();
        const allApps = await appsRes.json();

        // エラーチェック
        if (!Array.isArray(allApps)) {
          list.innerHTML = `<div class="text-center text-red-400 text-sm py-10"><i class="fas fa-exclamation-circle block text-3xl mb-2"></i>データ取得エラー<br><small>${allApps.error || ""}</small></div>`;
          return;
        }

        // チャット済みルームのIDマップ
        const roomMap = {};
        if (Array.isArray(rooms)) rooms.forEach(r => { roomMap[r._id] = r; });

        if (allApps.length === 0) {
          list.innerHTML = `<div class="text-center text-gray-400 text-sm py-10"><i class="fas fa-inbox text-3xl block mb-2 text-gray-300"></i>応募がありません</div>`;
          return;
        }

      list.innerHTML = allApps.map(app => {
        const room = roomMap[app._id];
        const unread = room?.unread || 0;
        const lastMsg = room?.lastMessage || null;
        const lastTime = room?.lastTime || null;
        const name = `${app.lastName || ""}${app.firstName || ""}`;
        const pos = positionMap[app.position] || app.position || "";
        const date = new Date(app.createdAt).toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" });
        return `
        <div class="room-item px-4 py-3.5 cursor-pointer hover:bg-blue-50 transition-colors ${unread > 0 ? 'bg-blue-50/50' : ''}"
          onclick="joinRoom('${app._id}','${app.type}')" data-id="${app._id}">
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shrink-0 mt-0.5">
              <i class="fas fa-user text-white text-xs"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-0.5">
                <span class="text-xs font-semibold text-gray-700">${typeMap[app.type]} - ${name || app.email || ""}</span>
                <span class="text-xs text-gray-400">${date}</span>
              </div>
              <p class="text-xs text-gray-500 truncate">${pos}</p>
              <p class="text-sm text-gray-500 truncate mt-0.5">${lastMsg || '<span class="text-gray-300">未チャット</span>'}</p>
              ${unread > 0 ? `<span class="inline-block mt-1 bg-blue-600 text-white text-xs rounded-full px-2 py-0.5">${unread}件未読</span>` : ""}
            </div>
          </div>
        </div>`;
      }).join("");
      } catch (e) {
        console.error("loadRooms error:", e);
        list.innerHTML = `<div class="text-center text-red-400 text-sm py-10"><i class="fas fa-exclamation-circle block text-3xl mb-2"></i>読み込みエラーが発生しました</div>`;
      }
    }

    async function joinRoom(applicationId, applicationType) {
      if (currentRoom) socket.emit("leaveRoom", currentRoom);
      currentRoom = applicationId;
      currentType = applicationType;

      // アクティブ強調
      document.querySelectorAll(".room-item").forEach(el => el.classList.remove("bg-blue-100"));
      document.querySelector(`.room-item[data-id="${applicationId}"]`)?.classList.add("bg-blue-100");

      const item = document.querySelector(`.room-item[data-id="${applicationId}"]`);
      const nameEl = item?.querySelector(".font-semibold");
      const posEl = item?.querySelector(".text-gray-500.truncate");
      document.getElementById("chatTitle").textContent = nameEl?.textContent || `${typeMap[applicationType]} 応募者`;
      document.getElementById("chatSubtitle").textContent = posEl?.textContent || `応募ID: ${applicationId}`;
      document.getElementById("msgInput").disabled = false;
      document.getElementById("sendBtn").disabled = false;

      socket.emit("joinRoom", applicationId);

      const res = await fetch(`/api/chat/${applicationId}`);
      const messages = await res.json();
      const area = document.getElementById("messagesArea");
      area.innerHTML = "";
      if (messages.length === 0) {
        area.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-gray-400"><i class="fas fa-comments text-5xl mb-3 text-gray-300"></i><p class="text-sm">まだメッセージはありません。最初のメッセージを送りましょう。</p></div>`;
      }
      messages.forEach(m => appendMessage(m));
      area.scrollTop = area.scrollHeight;

      // 未読バッジを消す
      if (item) {
        const badge = item.querySelector(".bg-blue-600");
        if (badge) badge.remove();
        item.classList.remove("bg-blue-50/50");
      }
    }

    function appendMessage(msg) {
      const area = document.getElementById("messagesArea");
      const isMine = msg.senderRole === "admin";
      const isOwner = me && msg.senderId && msg.senderId.toString() === me._id.toString();
      const canDelete = isOwner || me.role === "admin";
      const time = new Date(msg.createdAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });

      const wrap = document.createElement("div");
      wrap.className = `msg-wrap flex ${isMine ? "justify-end" : "justify-start"} items-end gap-2`;
      wrap.dataset.msgId = msg._id;

      if (msg.deleted) {
        wrap.innerHTML = `<p class="text-xs text-gray-300 italic px-4 py-1">このメッセージは削除されました</p>`;
        area.appendChild(wrap); return;
      }

      // ファイル
      let fileHtml = "";
      if (msg.fileUrl) {
        if (msg.fileType === "image") fileHtml = `<a href="${msg.fileUrl}" target="_blank"><img src="${msg.fileUrl}" class="rounded-xl max-w-[220px] max-h-[180px] object-cover mt-2 border border-white/20" /></a>`;
        else fileHtml = `<a href="${msg.fileUrl}" target="_blank" class="flex items-center gap-2 mt-2 underline text-sm opacity-80"><i class="fas fa-file-download"></i>${escapeHtml(msg.fileName || "添付ファイル")}</a>`;
      }

      const liked = me && (msg.likes || []).some(l => l.userId === me._id.toString());
      const likeCount = (msg.likes || []).length;
      const likeColor = liked ? "text-blue-500" : (isMine ? "text-white/60 hover:text-white" : "text-gray-400 hover:text-blue-500");
      const likeBtn = `<button class="like-btn ${likeColor} text-xs flex items-center gap-1 transition-colors" onclick="toggleLike('${msg._id}')"><i class="fas fa-thumbs-up"></i>${likeCount > 0 ? `<span>${likeCount}</span>` : ""}</button>`;
      const editBtn = (isOwner && msg.message && !msg.fileUrl) ? `<button class="text-gray-300 hover:text-blue-500 text-xs" onclick="openEdit('${msg._id}',this)" title="編集"><i class="fas fa-pen"></i></button>` : "";
      const delBtn = canDelete ? `<button class="text-gray-300 hover:text-red-400 text-xs" onclick="deleteMessage('${msg._id}')" title="削除"><i class="fas fa-trash-alt"></i></button>` : "";
      const textHtml = msg.message ? `<p class="break-words">${escapeHtml(msg.message)}</p>` : "";
      const editedBadge = msg.edited ? `<span class="text-xs opacity-50 ml-1">(編集済)</span>` : "";

      if (!isMine) {
        wrap.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center shrink-0">
            <i class="fas fa-user text-gray-500 text-xs"></i>
          </div>
          <div class="max-w-[65%]">
            <p class="text-xs text-gray-400 mb-1">${msg.senderName}</p>
            <div class="bg-white border border-gray-100 rounded-2xl rounded-bl-sm px-4 py-2.5 shadow-sm text-sm text-gray-800">${textHtml}${fileHtml}${editedBadge}</div>
            <div class="flex items-center gap-2 mt-1"><p class="text-xs text-gray-300">${time}</p>${likeBtn}<div class="msg-actions flex items-center gap-1.5">${editBtn}${delBtn}</div></div>
          </div>`;
      } else {
        wrap.innerHTML = `
          <div class="max-w-[65%] text-right">
            <p class="text-xs text-gray-400 mb-1">${msg.senderName}</p>
            <div class="bg-blue-700 text-white rounded-2xl rounded-br-sm px-4 py-2.5 shadow-sm text-sm inline-block text-left">${textHtml}${fileHtml}${editedBadge}</div>
            <div class="flex items-center justify-end gap-2 mt-1"><div class="msg-actions flex items-center gap-1.5">${editBtn}${delBtn}</div>${likeBtn}<p class="text-xs text-gray-300">${time}</p></div>
          </div>`;
      }
      area.appendChild(wrap);
    }

    function handleFileSelect(e) {
      const file = e.target.files[0]; if (!file) return;
      pendingFile = file;
      document.getElementById("filePreviewName").textContent = file.name;
      document.getElementById("filePreviewBar").classList.remove("hidden");
    }
    function clearFile() {
      pendingFile = null;
      document.getElementById("fileInput").value = "";
      document.getElementById("filePreviewBar").classList.add("hidden");
    }

    async function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text && !pendingFile) return;
      if (!currentRoom) return;
      let fileUrl = null, fileName = null, fileType = null;
      if (pendingFile) {
        const fd = new FormData(); fd.append("file", pendingFile);
        const up = await fetch("/api/chat/upload", { method: "POST", body: fd });
        const upData = await up.json();
        fileUrl = upData.fileUrl; fileName = upData.fileName; fileType = upData.fileType;
        clearFile();
      }
      socket.emit("sendMessage", {
        applicationId: currentRoom, applicationType: currentType,
        senderId: me._id, senderName: `${me.lastName||""}${me.firstName||me.username}`, senderRole: "admin",
        message: text, fileUrl, fileName, fileType
      });
      input.value = "";
    }

    async function toggleLike(messageId) { await fetch(`/api/chat/message/${messageId}/like`, { method: "POST" }); }

    function openEdit(messageId, btn) {
      editingMessageId = messageId;
      const bubble = btn.closest(".msg-wrap").querySelector("p.break-words");
      document.getElementById("editInput").value = bubble ? bubble.textContent : "";
      document.getElementById("editModal").classList.remove("hidden");
    }
    function closeEdit() { editingMessageId = null; document.getElementById("editModal").classList.add("hidden"); }
    async function submitEdit() {
      const newText = document.getElementById("editInput").value.trim();
      if (!newText || !editingMessageId) return;
      await fetch(`/api/chat/message/${editingMessageId}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: newText }) });
      closeEdit();
    }
    async function deleteMessage(messageId) {
      if (!confirm("このメッセージを削除しますか？")) return;
      await fetch(`/api/chat/message/${messageId}`, { method: "DELETE" });
    }

    socket.on("newMessage", (msg) => {
      if (msg.applicationId === currentRoom) {
        appendMessage(msg);
        const area = document.getElementById("messagesArea");
        area.scrollTop = area.scrollHeight;
      } else {
        loadRooms();
      }
    });

    socket.on("messageLiked", ({ messageId, likes }) => {
      const wrap = document.querySelector(`.msg-wrap[data-msg-id="${messageId}"]`); if (!wrap) return;
      const liked = me && likes.some(l => l.userId === me._id.toString());
      const isMySide = wrap.classList.contains("justify-end");
      const color = liked ? "text-blue-500" : (isMySide ? "text-white/60 hover:text-white" : "text-gray-400 hover:text-blue-500");
      const btn = wrap.querySelector(".like-btn");
      if (btn) { btn.className = `like-btn ${color} text-xs flex items-center gap-1 transition-colors`; btn.innerHTML = `<i class="fas fa-thumbs-up"></i>${likes.length > 0 ? `<span>${likes.length}</span>` : ""}`; }
    });

    socket.on("messageEdited", ({ messageId, message }) => {
      const wrap = document.querySelector(`.msg-wrap[data-msg-id="${messageId}"]`); if (!wrap) return;
      const bubble = wrap.querySelector("p.break-words"); if (bubble) bubble.textContent = message;
      if (!wrap.querySelector(".opacity-50")) { const d = wrap.querySelector(".bg-white,.bg-blue-700"); if (d) d.insertAdjacentHTML("beforeend", `<span class="text-xs opacity-50 ml-1">(編集済)</span>`); }
    });

    socket.on("messageDeleted", ({ messageId }) => {
      const wrap = document.querySelector(`.msg-wrap[data-msg-id="${messageId}"]`); if (!wrap) return;
      wrap.innerHTML = `<p class="text-xs text-gray-300 italic px-4 py-1">このメッセージは削除されました</p>`;
    });

    document.getElementById("msgInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll(".room-item").forEach(el => {
        el.style.display = el.dataset.id.includes(q) ? "" : "none";
      });
    });

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    init();
  </script>
</body>
</html>
