<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>応募詳細 - DXPRO SOLUTIONS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-['Noto_Sans_JP'] min-h-screen p-4 md:p-6">

  <div class="max-w-4xl mx-auto mt-4 md:mt-6">
    <div class="bg-white rounded-2xl border border-gray-100 p-6 md:p-8">
      <!-- ヘッダー -->
      <div class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
          <span class="w-1.5 h-8 bg-blue-700 rounded-full"></span>
          <h1 class="text-xl md:text-2xl font-bold text-gray-900">応募詳細</h1>
        </div>
        <a href="/application-status.html" class="border border-gray-200 hover:bg-gray-50 text-gray-600 font-medium py-2 px-4 rounded-xl transition text-sm inline-flex items-center gap-1.5">
          <i class="fas fa-arrow-left text-xs"></i>応募履歴へ戻る
        </a>
        <div id="editBtnWrap" class="hidden">
          <a id="editBtn" href="#" class="bg-blue-700 text-white font-medium py-2 px-4 rounded-xl hover:bg-blue-800 transition text-sm inline-flex items-center gap-1.5">
            <i class="fas fa-pen text-xs"></i>編集
          </a>
        </div>
      </div>

      <div id="content">
        <div class="text-center text-gray-400 py-12"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
      </div>
    </div>
  </div>

  <script>
    const positionMap = {
      frontend: "フロントエンドエンジニア", backend: "バックエンドエンジニア",
      designer: "UIデザイナー", pm: "プロジェクトマネージャー",
      consultant: "ITコンサルタント", qaengineer: "QAエンジニア"
    };

    function badge(status, stages) {
      if (!stages || stages.length === 0) {
        const base = "py-1 px-3 rounded-full text-sm font-semibold";
        switch(status) {
          case '承認済み': return `<span class="bg-green-100 text-green-800 ${base}">${status}</span>`;
          case '進行中': return `<span class="bg-yellow-100 text-yellow-800 ${base}">${status}</span>`;
          case '却下': return `<span class="bg-red-100 text-red-800 ${base}">${status}</span>`;
          default: return `<span class="bg-gray-100 text-gray-700 ${base}">${status || '書類選考中'}</span>`;
        }
      }
      const stage = stages.find(s => s.name === status) || stages[0];
      const colorMap = {
        gray:   "bg-gray-100 text-gray-700",
        blue:   "bg-blue-100 text-blue-700",
        yellow: "bg-yellow-100 text-yellow-700",
        orange: "bg-orange-100 text-orange-700",
        purple: "bg-purple-100 text-purple-700",
        green:  "bg-green-100 text-green-700",
        red:    "bg-red-100 text-red-700",
        pink:   "bg-pink-100 text-pink-700",
        teal:   "bg-teal-100 text-teal-700",
        indigo: "bg-indigo-100 text-indigo-700",
      };
      const cls = colorMap[stage.color] || colorMap.gray;
      return `<span class="py-1 px-3 rounded-full text-sm font-semibold ${cls}">${stage.name}</span>`;
    }

    function row(label, value) {
      if (!value && value !== 0) return "";
      return `<div class="flex flex-wrap gap-2 py-3 border-b border-gray-50">
        <span class="text-gray-400 font-medium text-sm w-36 shrink-0">${label}</span>
        <span class="text-gray-800 text-sm flex-1">${value}</span>
      </div>`;
    }

    function section(title, icon, content) {
      if (!content.trim()) return "";
      return `<div class="mb-6">
        <h3 class="flex items-center gap-2 text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">
          <i class="fas ${icon} text-blue-400"></i>${title}
        </h3>
        <div class="bg-gray-50 rounded-xl divide-y divide-gray-100">${content}</div>
      </div>`;
    }

    function textBlock(label, value) {
      if (!value) return "";
      return `<div class="mb-6">
        <p class="text-sm font-bold text-gray-500 mb-2">${label}</p>
        <div class="bg-gray-50 rounded-xl p-4 text-sm text-gray-800 whitespace-pre-wrap break-words leading-relaxed">${escapeHtml(value)}</div>
      </div>`;
    }

    function fileButton(label, url, icon="fa-file-pdf") {
      return `<a href="${url}" target="_blank"
        class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 transition text-sm font-medium">
        <i class="fas ${icon}"></i>${label}
      </a>`;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function load() {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) { document.getElementById("content").innerHTML = `<p class="text-red-500 text-center">IDが指定されていません</p>`; return; }

      const [res, meRes, stagesRes] = await Promise.all([
        fetch(`/api/application/${id}`),
        fetch("/api/me"),
        fetch("/api/pipeline/stages")
      ]);
      const data = await res.json();
      if (data.status !== "success") { document.getElementById("content").innerHTML = `<p class="text-red-500 text-center">応募情報が見つかりません</p>`; return; }

      const a = data.application;
      const me = meRes.ok ? await meRes.json() : null;
      const isAdmin = me && me.role === "admin";
      const stages = stagesRes.ok ? await stagesRes.json() : [];
      const isCareer = a.type === "中途";

      // 編集可否チェック
      const firstStage = stages.filter(s => !s.isRejection).sort((x,y) => x.order - y.order)[0];
      const editableNames = [null, undefined, "", "送信済み"];
      if (firstStage) editableNames.push(firstStage.name);
      const canEdit = isAdmin || editableNames.includes(a.status);
      if (canEdit) {
        document.getElementById("editBtnWrap").classList.remove("hidden");
        document.getElementById("editBtn").href = "/application-edit.html?id=" + a._id;
      }

      // ステータス
      const headerHtml = `
        <div class="flex flex-wrap items-center gap-3 mb-6 pb-6 border-b border-gray-100">
          <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
            <i class="fas fa-user text-blue-700"></i>
          </div>
          <div class="flex-1">
            <p class="font-bold text-gray-900 text-lg">${escapeHtml(a.lastName||"")} ${escapeHtml(a.firstName||"")}</p>
            <p class="text-gray-400 text-sm">${escapeHtml(a.hurilastName||"")} ${escapeHtml(a.hurifirstName||"")}</p>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">${a.type || "不明"}</span>
            ${badge(a.status, stages)}
          </div>
        </div>`;

      // 選考ステージ（管理者のみ変更可能）
      const colorMap = { gray:"bg-gray-100 text-gray-700", blue:"bg-blue-100 text-blue-700", yellow:"bg-yellow-100 text-yellow-700", orange:"bg-orange-100 text-orange-700", purple:"bg-purple-100 text-purple-700", green:"bg-green-100 text-green-700", red:"bg-red-100 text-red-700", pink:"bg-pink-100 text-pink-700", teal:"bg-teal-100 text-teal-700", indigo:"bg-indigo-100 text-indigo-700" };
      const normalStages = stages.filter(s => !s.isRejection).sort((a,b) => a.order - b.order);
      const rejStages = stages.filter(s => s.isRejection);
      const currentStage = stages.find(s => s.name === a.status) || stages[0];

      let stageHtml = "";
      if (stages.length > 0) {
        const stepsHtml = normalStages.map((s, i) => {
          const isActive = currentStage && s.name === currentStage.name;
          const isPast = currentStage && !currentStage.isRejection && s.order < currentStage.order;
          const dotCls = isActive ? "w-5 h-5 rounded-full bg-blue-600 border-2 border-blue-600 flex items-center justify-center" :
                         isPast  ? "w-5 h-5 rounded-full bg-blue-200 border-2 border-blue-300 flex items-center justify-center" :
                                   "w-5 h-5 rounded-full bg-white border-2 border-gray-300 flex items-center justify-center";
          const lineCls = isPast || isActive ? "flex-1 h-0.5 bg-blue-300" : "flex-1 h-0.5 bg-gray-200";
          const nameCls = isActive ? "text-blue-700 font-bold" : isPast ? "text-blue-400" : "text-gray-400";
          const clickHandler = isAdmin ? `onclick="updateStage('${a._id}','${escapeHtml(s.name)}')" style="cursor:pointer"` : "";
          return '<div class="flex flex-col items-center" ' + clickHandler + ' title="' + escapeHtml(s.name) + '">' +
            '<div class="' + dotCls + '">' + (isPast ? '<i class="fas fa-check text-blue-400 text-[8px]"></i>' : isActive ? '<div class="w-2 h-2 rounded-full bg-white"></div>' : '') + '</div>' +
            '<span class="text-[10px] mt-1 ' + nameCls + ' text-center w-14 leading-tight">' + escapeHtml(s.name) + '</span>' +
            '</div>' + (i < normalStages.length - 1 ? '<div class="' + lineCls + ' mt-2.5 mx-1"></div>' : '');
        }).join("");

        const rejBtns = isAdmin ? rejStages.map(s => {
          const cls = colorMap[s.color] || colorMap.gray;
          const isActive2 = currentStage && s.name === currentStage.name;
          return '<button onclick="updateStage(\'' + a._id + '\',\'' + escapeHtml(s.name) + '\')" class="text-xs px-3 py-1.5 rounded-full font-medium border transition ' + cls + (isActive2 ? ' ring-2 ring-offset-1 ring-red-400' : ' opacity-70 hover:opacity-100') + '">' + escapeHtml(s.name) + '</button>';
        }).join("") : rejStages.filter(s => currentStage && s.name === currentStage.name).map(s => '<span class="text-xs px-3 py-1.5 rounded-full font-medium ' + (colorMap[s.color] || colorMap.gray) + '">' + escapeHtml(s.name) + '</span>').join("");

        stageHtml = `<div class="mb-6 p-4 bg-gray-50 rounded-xl border border-gray-100">
          <div class="flex items-center justify-between mb-4">
            <p class="text-sm font-bold text-gray-600">選考ステージ</p>
            ${isAdmin ? `<a href="/pipeline-settings.html" class="text-xs text-blue-500 hover:underline"><i class="fas fa-cog mr-1"></i>ステージ設定</a>` : ""}
          </div>
          <div class="flex items-start overflow-x-auto pb-2">${stepsHtml}</div>
          ${rejBtns ? `<div class="mt-3 flex flex-wrap gap-2">${rejBtns}</div>` : ""}
          ${isAdmin && currentStage ? `<p class="text-xs text-gray-400 mt-2">現在: <span class="font-medium text-gray-600">${escapeHtml(currentStage.name)}</span> ${isAdmin ? "（ステージをクリックして変更）" : ""}</p>` : ""}
        </div>`;
      }

      // 基本情報
      const basicHtml = section("基本情報", "fa-id-card", [
        row("応募日", new Date(a.createdAt).toLocaleDateString("ja-JP")),
        row("生年月日", a.birthdate ? new Date(a.birthdate).toLocaleDateString("ja-JP") : null),
        row("性別", a.gender),
        row("メール", a.email),
        row("電話番号", a.phone),
      ].join(""));

      // 住所
      let address = "";
      if (a.noAddress) { address = "（記入なし）"; }
      else if (a.prefecture || a.city || a.addressDetail) {
        address = `〒${a.postalCode||""} ${a.prefecture||""}${a.city||""}${a.addressDetail||""}`;
      }
      const addressHtml = address ? section("住所", "fa-map-marker-alt", row("住所", address)) : "";

      // 学歴
      const eduHtml = section("学歴", "fa-graduation-cap", [
        row("最終学歴", a.education),
        row("専攻", a.major),
        row("卒業予定", a.graduation),
      ].join(""));

      // 希望条件
      const prefHtml = section("希望条件", "fa-briefcase", [
        row("希望ポジション", positionMap[a.position] || a.position),
        row("勤務形態", a.locationPreference),
        ...(isCareer ? [row("希望年収", a.gold)] : []),
      ].join(""));

      // 職歴（中途のみ）
      let careerHtml = "";
      if (isCareer) {
        careerHtml = section("現職情報", "fa-building", [
          row("現職企業", a.currentCompany),
          row("役職", a.currentPosition),
          row("業務内容", a.currentJobDescription),
          row("経験年数", a.experienceYears ? `${a.experienceYears}年` : null),
          row("希望入社時期", a.desiredJoinDate),
        ].join(""));
      }

      // PR・志望動機
      const prHtml = textBlock("自己PR", a.pr);
      const motivationHtml = a.motivation ? textBlock("志望動機", a.motivation) : "";
      const changeReasonHtml = (isCareer && a.changeReason) ? textBlock("転職理由", a.changeReason) : "";

      // ポートフォリオURL
      const portfolioUrlHtml = a.portfolio ? `<div class="mb-6">
        <p class="text-sm font-bold text-gray-500 mb-2">GitHub / ポートフォリオURL</p>
        <a href="${escapeHtml(a.portfolio)}" target="_blank" class="text-blue-600 hover:underline text-sm break-all">${escapeHtml(a.portfolio)}</a>
      </div>` : "";

      // 添付ファイル
      const files = [];
      let hasOldFiles = false;
      // 新方式（MongoDB保存 - v22以降）
      if (a.resumeFileId) files.push(fileButton(a.resumeFileName || "履歴書", `/api/file/${a.resumeFileId}`));
      if (a.careerFileId) files.push(fileButton(a.careerFileName || "職務経歴書", `/api/file/${a.careerFileId}`, "fa-file-alt"));
      if (a.portfolioFileIds && a.portfolioFileIds.length > 0) {
        a.portfolioFileIds.forEach((pf, i) => {
          files.push(fileButton(pf.fileName || `作品ファイル ${i+1}`, `/api/file/${pf.fileId}`, "fa-file"));
        });
      }
      // 旧方式（パスベース）- ファイルはHerokuで消えているため注記のみ表示
      if (files.length === 0 && (a.resume || a.career || (a.portfolioFiles && a.portfolioFiles.length > 0))) {
        hasOldFiles = true;
      }

      let filesHtml = "";
      if (files.length > 0) {
        filesHtml = `<div class="mb-6">
          <p class="text-sm font-bold text-gray-500 mb-3">添付ファイル</p>
          <div class="flex flex-wrap gap-3">${files.join("")}</div>
        </div>`;
      } else if (hasOldFiles) {
        filesHtml = `<div class="mb-6">
          <p class="text-sm font-bold text-gray-500 mb-3">添付ファイル</p>
          <div class="flex items-start gap-2 px-4 py-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-700 text-sm">
            <i class="fas fa-exclamation-triangle mt-0.5 shrink-0"></i>
            <span>この応募のファイルはサーバーの更新により取得できなくなりました。<br>お手数ですが再度ファイルをアップロードし応募しなおしてください。</span>
          </div>
        </div>`;
      }

      // 人事コメント
      const hrHtml = `<div class="mb-6">
        <p class="text-sm font-bold text-gray-500 mb-2">人事担当者からの連絡</p>
        <div class="p-4 bg-blue-50 rounded-xl border border-blue-100 text-blue-800 text-sm">${escapeHtml(a.hrComment) || "なし"}</div>
      </div>`;

      document.getElementById("content").innerHTML =
        headerHtml + stageHtml + basicHtml + addressHtml + eduHtml + prefHtml + careerHtml +
        prHtml + motivationHtml + changeReasonHtml + portfolioUrlHtml + filesHtml + hrHtml;
    }

    async function updateStage(appId, stageName) {
      const res = await fetch("/api/application/" + appId + "/stage", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stage: stageName })
      });
      const data = await res.json();
      if (data.status === "success") {
        // リロードして最新のステージを反映
        load();
      } else {
        alert("更新に失敗しました: " + (data.error || ""));
      }
    }

    load();
  </script>
</body>
</html>
