<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>応募詳細 - DXPRO SOLUTIONS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-['Noto_Sans_JP'] min-h-screen p-6">

  <div class="max-w-5xl mx-auto mt-6 p-8 bg-white rounded-2xl border border-gray-100">
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-3">
        <span class="w-1.5 h-8 bg-blue-700 rounded-full"></span>
        <h1 class="text-2xl font-bold text-gray-900">応募詳細</h1>
      </div>
      <a href="/application-status.html" class="border border-gray-200 hover:bg-gray-50 text-gray-600 font-semibold py-2.5 px-5 rounded-xl transition duration-200 inline-flex items-center gap-1.5">
        <i class="fas fa-arrow-left text-xs"></i>応募履歴へ戻る
      </a>
    </div>

    <div id="applicationDetail" class="space-y-5 text-gray-700">
      <!-- 動的に応募情報をここに表示 -->
      <p class="flex flex-wrap gap-2"><strong class="text-gray-500 font-medium w-32 shrink-0">日付</strong> <span id="appDate">読み込み中...</span></p>
      <p class="flex flex-wrap gap-2"><strong class="text-gray-500 font-medium w-32 shrink-0">応募タイプ</strong> <span id="appType">読み込み中...</span></p>
      <p class="flex flex-wrap gap-2"><strong class="text-gray-500 font-medium w-32 shrink-0">名前</strong> <span id="appName">読み込み中...</span></p>
      <p class="flex flex-wrap gap-2"><strong class="text-gray-500 font-medium w-32 shrink-0">メール</strong> <span id="appEmail">読み込み中...</span></p>
      <p class="flex flex-wrap gap-2"><strong class="text-gray-500 font-medium w-32 shrink-0">応募ポジション</strong> <span id="appPosition">読み込み中...</span></p>
      <p class="flex flex-wrap gap-2 items-center"><strong class="text-gray-500 font-medium w-32 shrink-0">ステータス</strong> <span id="appStatus" class="inline-block py-1 px-3 rounded-full text-sm font-semibold bg-gray-100 text-gray-800">読み込み中</span></p>
      <div class="pt-2">
        <p class="text-gray-500 font-medium mb-2">自己PR</p>
        <div id="appPR" class="p-4 bg-gray-50 rounded-xl border border-gray-100 break-words whitespace-pre-wrap text-gray-700">長い文章でも折り返されます...</div>
      </div>
      <div>
        <p class="text-gray-500 font-medium mb-2">志望動機</p>
        <div id="appMotivation" class="p-4 bg-gray-50 rounded-xl border border-gray-100 break-words whitespace-pre-wrap text-gray-700">ここも同様です...</div>
      </div>
      <div>
        <p class="text-gray-500 font-medium mb-2">人事担当者からの連絡</p>
        <div id="appHRComment" class="p-4 bg-blue-50 rounded-xl border border-blue-100 text-blue-800">読み込み中...</div>
      </div>
      <div id="filesSection" class="hidden">
        <p class="text-gray-500 font-medium mb-3">添付ファイル</p>
        <div id="filesList" class="flex flex-wrap gap-3"></div>
      </div>
    </div>
  </div>


  <script>
    const positionMap = {
      frontend: "フロントエンド",
      backend: "バックエンド",
      designer: "UIデザイナー",
      pm: "プロジェクトマネージャー",
      consultant: "コンサルタント",
      qaengineer: "QAエンジニア"
    };

    function getStatusBadge(status) {
      const base = "py-1 px-3 rounded-full text-sm font-semibold shadow-sm";
      switch(status) {
        case '承認済み': return `<span class="bg-green-100 text-green-800 ${base}">${status}</span>`;
        case '進行中': return `<span class="bg-yellow-100 text-yellow-800 ${base}">${status}</span>`;
        case '却下': return `<span class="bg-red-100 text-red-800 ${base}">${status}</span>`;
        default: return `<span class="bg-gray-100 text-gray-800 ${base}">${status}</span>`;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadApplication() {
    try {
        if (!id) throw new Error("IDが指定されていません");

        const res = await fetch(`/api/application/${id}`);
        const data = await res.json();

        if (data.status === "success" && data.application) {
        const app = data.application;
        document.getElementById("appDate").textContent = new Date(app.createdAt).toLocaleDateString();
        document.getElementById("appType").textContent = app.type || "不明";
        document.getElementById("appName").textContent = `${app.lastName || ""} ${app.firstName || ""}`;
        document.getElementById("appEmail").textContent = app.email || "";
        document.getElementById("appPosition").textContent = positionMap[app.position] || app.position || "";
        document.getElementById("appStatus").innerHTML = getStatusBadge(app.status || "送信済み");
        document.getElementById("appPR").textContent = app.pr || "なし";
        document.getElementById("appMotivation").textContent = app.motivation || "なし";
        document.getElementById("appHRComment").textContent = app.hrComment || "なし";

        // 添付ファイル表示
        const fileEntries = [];
        if (app.resume) fileEntries.push({ label: "履歴書", path: app.resume });
        if (app.career) fileEntries.push({ label: "職務経歴書", path: app.career });
        if (app.portfolioFiles && app.portfolioFiles.length > 0) {
          app.portfolioFiles.forEach((p, i) => fileEntries.push({ label: `作品ファイル ${i + 1}`, path: p }));
        }
        if (fileEntries.length > 0) {
          const icons = { "履歴書": "fa-file-pdf", "職務経歴書": "fa-file-alt" };
          document.getElementById("filesSection").classList.remove("hidden");
          document.getElementById("filesList").innerHTML = fileEntries.map(f => {
            const url = "/" + f.path.replace(/\\/g, "/");
            const icon = icons[f.label] || "fa-file";
            return `<a href="${url}" target="_blank"
              class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 transition text-sm font-medium">
              <i class="fas ${icon}"></i>${f.label}
            </a>`;
          }).join("");
        }
        } else {
        document.getElementById("applicationDetail").innerHTML = `<p class="text-center text-gray-500">応募情報が見つかりません</p>`;
        }
    } catch(err) {
        console.error(err);
        document.getElementById("applicationDetail").innerHTML = `<p class="text-center text-red-500">読み込み中にエラーが発生しました</p>`;
    }
    }

    loadApplication();
  </script>
</body>
</html>
