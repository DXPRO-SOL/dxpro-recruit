<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <title>設定 | DXPRO SOLUTIONS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-['Noto_Sans_JP'] min-h-screen flex flex-col items-center pt-12 pb-12 px-4 space-y-6">

  <!-- 基本情報 -->
  <div class="bg-white shadow-sm border border-gray-100 rounded-2xl p-8 w-full max-w-3xl">
    <div class="flex items-center gap-3 mb-8">
      <span class="w-1.5 h-7 bg-blue-700 rounded-full"></span>
      <h1 class="text-2xl font-bold text-gray-900">アカウント設定</h1>
    </div>

    <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-white font-medium text-sm"></div>

    <form id="settingsForm" class="space-y-5">
      <div>
        <label class="block mb-1.5 text-sm font-medium text-gray-600">ログインID</label>
        <input type="text" name="username" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" required>
      </div>

      <div>
        <label class="block mb-1.5 text-sm font-medium text-gray-600">メールアドレス</label>
        <input type="email" name="email" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" required>
      </div>

      <div>
        <label class="block mb-1.5 text-sm font-medium text-gray-600">電話番号</label>
        <input type="tel" name="phone" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" required>
      </div>

      <div>
        <label class="block mb-1.5 text-sm font-medium text-gray-600">パスワード変更</label>
        <input type="password" name="password" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" placeholder="新しいパスワード">
        <input type="password" name="passwordConfirm" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 mt-2 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" placeholder="確認用パスワード">
        <p class="text-xs text-gray-400 mt-1.5">変更する場合のみ入力してください</p>
      </div>

      <div class="w-full max-w-3xl pt-2">
        <button type="submit" class="w-full bg-blue-700 text-white font-semibold py-3 rounded-xl hover:bg-blue-800 hover:shadow-md transition-all">
          保存
        </button>
      </div>      
    </form>
  </div>

  <!-- 応募設定 -->
  <div class="bg-white shadow-sm border border-gray-100 rounded-2xl p-8 w-full max-w-3xl">
    <div class="flex items-center gap-3 mb-8">
      <span class="w-1.5 h-7 bg-blue-700 rounded-full"></span>
      <h1 class="text-2xl font-bold text-gray-900">応募設定</h1>
    </div>
    
    <form id="applyForm" class="space-y-5">
      <div>
        <span class="block mb-2 text-sm font-medium text-gray-600">応募区分</span>
        <label class="inline-flex items-center mr-6">
          <input type="radio" name="employmentType" value="newGrad" class="text-blue-600 focus:ring-blue-400">
          <span class="ml-2">新卒</span>
        </label>
        <label class="inline-flex items-center">
          <input type="radio" name="employmentType" value="midCareer" class="text-blue-600 focus:ring-blue-400">
          <span class="ml-2">中途</span>
        </label>
      </div>

      <!-- 新卒 -->
      <div id="newGradFields" class="hidden space-y-2">
        <input type="text" name="graduationSchool" placeholder="卒業予定学校名" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition">
        <input type="month" name="expectedGraduation" placeholder="卒業予定年月" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition">
      </div>

      <!-- 中途 -->
      <div id="midCareerFields" class="hidden">
        <label class="flex items-center space-x-2 mt-2">
          <input type="checkbox" name="hasCurrentJob" id="hasCurrentJob" class="text-blue-600 focus:ring-blue-400">
          <span>現職がある</span>
        </label>
        <div id="currentJobFields" class="hidden space-y-2 mt-2">
          <span class="block text-sm font-medium text-gray-600">退職予定日</span>
          <input type="date" name="expectedResignation" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition">
          <span class="block text-sm font-medium text-gray-600">入社希望日</span>
          <input type="date" name="desiredJoinDate" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition">
        </div>
      </div>
        <!-- ホーム戻る -->
      <div class="w-full max-w-3xl pt-2 space-y-3">

          <button type="submit" class="w-full bg-blue-700 text-white font-semibold py-3 rounded-xl hover:bg-blue-800 hover:shadow-md transition-all">
            保存
          </button>
        <a href="/index.html"
          class="block text-center border border-gray-200 text-gray-600 font-semibold py-3 rounded-xl hover:bg-gray-50 transition">
          <i class="fas fa-arrow-left mr-1.5 text-xs"></i>ホームに戻る
        </a>
        <!-- 管理者用リンク -->
        <div id="adminLinks" class="hidden pt-2 border-t border-gray-100">
          <p class="text-xs text-gray-400 mb-2 font-medium">管理者メニュー</p>
          <a href="/pipeline-settings.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl border border-blue-100 bg-blue-50 text-blue-700 hover:bg-blue-100 transition text-sm font-medium">
            <i class="fas fa-project-diagram"></i>選考ステージ設定
            <span class="ml-auto text-blue-400 text-xs">採用パイプライン管理 →</span>
          </a>
          <a href="/application-case.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl border border-gray-100 bg-gray-50 text-gray-700 hover:bg-gray-100 transition text-sm font-medium mt-2">
            <i class="fas fa-users"></i>応募管理
            <span class="ml-auto text-gray-400 text-xs">全応募者を管理 →</span>
          </a>
        </div>
      </div>
    </form>
  </div>



<script>
async function loadUser() {
  try {
    const res = await fetch("/api/user/me");
    if (!res.ok) throw new Error("ユーザー情報取得失敗");
    const data = await res.json();
    const user = data.user;

    // 管理者メニュー表示
    const meRes = await fetch("/api/me");
    if (meRes.ok) {
      const me = await meRes.json();
      if (me && me.role === "admin") {
        document.getElementById("adminLinks").classList.remove("hidden");
      }
    }

    document.querySelector('[name="username"]').value = user.username;
    document.querySelector('[name="email"]').value = user.email;
    document.querySelector('[name="phone"]').value = user.phone;

    document.querySelector(`[name="employmentType"][value="${user.employmentType}"]`).checked = true;

    if(user.employmentType === "newGrad") {
      document.getElementById("newGradFields").classList.remove("hidden");
      document.getElementById("midCareerFields").classList.add("hidden");
      document.querySelector('[name="graduationSchool"]').value = user.graduationSchool || "";
      document.querySelector('[name="expectedGraduation"]').value = user.expectedGraduation || "";
    } else {
      document.getElementById("midCareerFields").classList.remove("hidden");
      document.getElementById("newGradFields").classList.add("hidden");
      document.getElementById("hasCurrentJob").checked = user.hasCurrentJob || false;
      if(user.hasCurrentJob){
        document.getElementById("currentJobFields").classList.remove("hidden");
        document.querySelector('[name="expectedResignation"]').value = user.expectedResignation ? user.expectedResignation.split("T")[0] : "";
        document.querySelector('[name="desiredJoinDate"]').value = user.desiredJoinDate ? user.desiredJoinDate.split("T")[0] : "";
      }
    }

  } catch(e){
    console.error(e);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadUser();

  const alertBox = document.getElementById("alertBox");

  // アカウント設定フォーム送信
document.getElementById("settingsForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const body = {};
  formData.forEach((v,k)=>body[k]=v);

  // 비밀번호 일치 체크
  if(body.password && body.password !== body.passwordConfirm){
    alert("パスワードが一致しません");
    return;
  }

  // 확인용 필드는 서버로 보내지 않도록 제거
  delete body.passwordConfirm;

  try {
    const res = await fetch("/api/user/account", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    const alertBox = document.getElementById("alertBox");
    if(data.status === "success"){
      alertBox.textContent = "✅ アカウント情報を更新しました";
      alertBox.className = "mb-4 p-3 rounded-lg font-medium text-white bg-green-500";
    } else {
      alertBox.textContent = "❌ 更新に失敗しました";
      alertBox.className = "mb-4 p-3 rounded-lg font-medium text-white bg-red-500";
    }
    alertBox.classList.remove("hidden");
    setTimeout(()=>alertBox.classList.add("hidden"), 3000);
  } catch(err) {
    console.error(err);
    alert("サーバーエラーが発生しました");
  }
});

  // 応募設定フォーム送信
  document.getElementById("applyForm").addEventListener("submit", async e => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const body = {};
    formData.forEach((v,k)=>body[k]=v);

    try {
      const res = await fetch("/api/user/apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      alert(data.message || "✅ 応募設定を更新しました");
    } catch(err) {
      console.error(err);
      alert("サーバーエラーが発生しました");
    }
  });

  // 雇用種別変更時の表示切替
  document.querySelectorAll('[name="employmentType"]').forEach(el=>{
    el.addEventListener("change", e=>{
      if(e.target.value === "newGrad"){
        document.getElementById("newGradFields").classList.remove("hidden");
        document.getElementById("midCareerFields").classList.add("hidden");
      } else {
        document.getElementById("midCareerFields").classList.remove("hidden");
        document.getElementById("newGradFields").classList.add("hidden");
      }
    });
  });

  document.getElementById("hasCurrentJob").addEventListener("change", e=>{
    document.getElementById("currentJobFields").classList.toggle("hidden", !e.target.checked);
  });
});

</script>
</body>
</html>
