<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>応募状況一覧 - DXPRO SOLUTIONS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 p-6 font-['Noto_Sans_JP'] min-h-screen">

  <div class="max-w-6xl mx-auto mt-10">
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-3">
        <span class="w-1.5 h-8 bg-blue-700 rounded-full"></span>
        <h2 class="text-2xl font-bold text-gray-900">応募状況一覧</h2>
      </div>
      <div class="flex items-center gap-3">
        <a href="chat.html" class="bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 px-5 rounded-xl transition duration-200 inline-flex items-center gap-1.5">
          <i class="fas fa-comment-dots text-sm"></i>担当者とチャット
        </a>
        <a href="/" class="border border-gray-200 hover:bg-gray-50 text-gray-600 font-semibold py-2.5 px-5 rounded-xl transition duration-200 inline-flex items-center gap-1.5">
          <i class="fas fa-arrow-left text-xs"></i>ホームに戻る
        </a>
      </div>
    </div>

    <div class="overflow-x-auto rounded-2xl border border-gray-100 bg-white">
      <table id="appTable" class="min-w-full divide-y divide-gray-100">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">日付</th>
            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">応募タイプ</th>
            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">名前</th>
            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">メール</th>
            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">応募ポジション</th>
            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">ステータス</th>
            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">チャット</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-100"></tbody>
      </table>
    </div>
  </div>


  <script>
    // ポジション表示名
    const positionMap = {
      frontend: "フロントエンド",
      backend: "バックエンド",
      designer: "UIデザイナー",
      pm: "プロジェクトマネージャー",
      consultant: "コンサルタント",
      qaengineer: "QAエンジニア"
    };

    // ステータスバッジ
    function getStatusBadge(status) {
      if (!status) status = "送信済み";
      const base = "py-1 px-3 rounded-full text-sm font-semibold shadow-sm";
      switch(status) {
        case '承認済み':
          return `<span class="bg-green-100 text-green-800 ${base}">${status}</span>`;
        case '進行中':
          return `<span class="bg-yellow-100 text-yellow-800 ${base}">${status}</span>`;
        case '却下':
          return `<span class="bg-red-100 text-red-800 ${base}">${status}</span>`;
        default:
          return `<span class="bg-gray-100 text-gray-800 ${base}">${status}</span>`;
      }
    }

    // 応募一覧ロード
    async function loadApplications() {
      try {
        const res = await fetch("/api/applications");
        const data = await res.json();
        const tbody = document.querySelector("#appTable tbody");
        tbody.innerHTML = "";

        if (data.status === "success" && data.applications.length > 0) {
          data.applications.forEach(app => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-gray-50 cursor-pointer transition duration-150";

            const displayPosition = positionMap[app.position] || app.position || "";

            tr.innerHTML = `
              <td class="px-6 py-4 whitespace-nowrap">${new Date(app.createdAt).toLocaleDateString()}</td>
              <td class="px-6 py-4 whitespace-nowrap">${app.type || "不明"}</td>
              <td class="px-6 py-4 whitespace-nowrap">${app.lastName || ""} ${app.firstName || ""}</td>
              <td class="px-6 py-4 whitespace-nowrap">${app.email || ""}</td>
              <td class="px-6 py-4 whitespace-nowrap">${displayPosition}</td>
              <td class="px-6 py-4 whitespace-nowrap">${getStatusBadge(app.status)}</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <a href="/chat.html?applicationId=${app._id}&type=${app.typeKey || app.type}" onclick="event.stopPropagation()"
                  class="inline-flex items-center gap-1.5 text-blue-700 hover:text-blue-900 font-medium text-sm">
                  <i class="fas fa-comment-dots"></i>チャット
                </a>
              </td>
            `;
            tbody.appendChild(tr);

            // 行クリックで詳細画面へ遷移
            tr.addEventListener("click", () => {
              window.location.href = `/application-detail.html?id=${app._id}`;
            });
          });
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="px-6 py-4 text-center text-gray-400">応募履歴がありません</td>
            </tr>
          `;
        }
      } catch (err) {
        console.error(err);
        const tbody = document.querySelector("#appTable tbody");
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">読み込み中にエラーが発生しました</td></tr>`;
      }
    }

    loadApplications();
  </script>
</body>
</html>
