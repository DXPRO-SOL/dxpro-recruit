<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採用担当者とのチャット - DXPRO SOLUTIONS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .msg-actions { display: none; }
    .msg-wrap:hover .msg-actions { display: flex; }
  </style>
</head>
<body class="bg-gray-50 font-['Noto_Sans_JP'] min-h-screen flex flex-col">

  <header class="bg-gradient-to-r from-[#0b2447] to-[#12395e] text-white px-6 py-4 flex items-center gap-4 shadow-lg">
    <a href="application-status.html" class="text-white/70 hover:text-white transition-colors">
      <i class="fas fa-arrow-left text-lg"></i>
    </a>
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-blue-400/30 flex items-center justify-center">
        <i class="fas fa-user-tie text-sm text-blue-200"></i>
      </div>
      <div>
        <p class="font-semibold text-sm leading-tight">採用担当者</p>
        <p class="text-white/60 text-xs" id="roomInfo">応募を選択してください</p>
      </div>
    </div>
  </header>

  <div id="roomSelectorWrap" class="bg-white border-b border-gray-100 px-4 py-2 hidden">
    <select id="roomSelector" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200">
      <option value="">応募を選択...</option>
    </select>
  </div>

  <main id="messagesArea" class="flex-1 overflow-y-auto px-4 py-5 space-y-3 pb-28">
    <div id="emptyState" class="flex flex-col items-center justify-center h-64 text-gray-400 py-16">
      <i class="fas fa-comments text-5xl mb-4 text-gray-300"></i>
      <p class="text-sm">応募を選択してチャットを開始してください</p>
    </div>
  </main>

  <div id="filePreviewBar" class="hidden fixed bottom-16 left-0 right-0 bg-blue-50 border-t border-blue-100 px-4 py-2 flex items-center gap-3 text-sm text-blue-700 z-10">
    <i class="fas fa-paperclip"></i>
    <span id="filePreviewName" class="flex-1 truncate"></span>
    <button onclick="clearFile()" class="text-blue-400 hover:text-blue-700"><i class="fas fa-times"></i></button>
  </div>

  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-3 shadow-lg z-10">
    <div class="flex gap-2 max-w-3xl mx-auto items-center">
      <label for="fileInput" class="cursor-pointer text-gray-400 hover:text-blue-600 transition-colors px-1" title="ファイルを添付">
        <i class="fas fa-paperclip text-lg"></i>
      </label>
      <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
      <input id="msgInput" type="text" placeholder="メッセージを入力..." disabled
        class="flex-1 border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 disabled:bg-gray-50 disabled:text-gray-400">
      <button id="sendBtn" onclick="sendMessage()" disabled
        class="bg-blue-700 text-white px-5 py-2.5 rounded-full font-medium text-sm hover:bg-blue-800 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <div id="editModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl">
      <h3 class="font-semibold text-gray-800 mb-3">メッセージを編集</h3>
      <input id="editInput" type="text" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200">
      <div class="flex gap-2 mt-4">
        <button onclick="closeEdit()" class="flex-1 border border-gray-200 text-gray-600 rounded-xl py-2 text-sm hover:bg-gray-50">キャンセル</button>
        <button onclick="submitEdit()" class="flex-1 bg-blue-700 text-white rounded-xl py-2 text-sm hover:bg-blue-800">保存</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let me = null, currentRoom = null, currentType = null, pendingFile = null, editingMessageId = null;
    const positionMap = { frontend:"フロントエンドエンジニア", backend:"バックエンドエンジニア", designer:"UIデザイナー", pm:"プロジェクトマネージャー", consultant:"ITコンサルタント", qaengineer:"QAエンジニア" };
    const typeMap = { newgrad:"新卒採用", career:"中途採用" };

    async function init() {
      const meRes = await fetch("/api/me");
      if (!meRes.ok) { location.href = "/login.html"; return; }
      me = await meRes.json();
      const params = new URLSearchParams(location.search);
      const directId = params.get("applicationId");
      const directType = params.get("type");
      const roomsRes = await fetch("/api/my-chat-rooms");
      const rooms = await roomsRes.json();
      const selector = document.getElementById("roomSelector");
      rooms.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r._id; opt.dataset.type = r.type;
        const pos = positionMap[r.position] || r.position;
        const date = new Date(r.createdAt).toLocaleDateString("ja-JP");
        const name = (r.lastName || r.firstName) ? ` - ${r.lastName || ""}${r.firstName || ""}` : "";
        opt.textContent = `${typeMap[r.type]}${name} - ${pos} (${date})${r.unread > 0 ? ` 【未読${r.unread}件】` : ""}`;
        selector.appendChild(opt);
      });
      if (rooms.length > 1 || !directId) document.getElementById("roomSelectorWrap").classList.remove("hidden");
      selector.addEventListener("change", () => { const opt = selector.options[selector.selectedIndex]; if (opt.value) joinRoom(opt.value, opt.dataset.type); });
      if (directId && directType) { joinRoom(directId, directType); selector.value = directId; }
      else if (rooms.length === 1) { joinRoom(rooms[0]._id, rooms[0].type); selector.value = rooms[0]._id; }
    }

    async function joinRoom(applicationId, applicationType) {
      if (currentRoom) socket.emit("leaveRoom", currentRoom);
      currentRoom = applicationId; currentType = applicationType;
      document.getElementById("roomInfo").textContent = `${typeMap[applicationType] || applicationType} - ID: ...${applicationId.slice(-6)}`;
      document.getElementById("msgInput").disabled = false;
      document.getElementById("sendBtn").disabled = false;
      socket.emit("joinRoom", applicationId);
      const res = await fetch(`/api/chat/${applicationId}`);
      const messages = await res.json();
      const area = document.getElementById("messagesArea");
      area.innerHTML = "";
      if (messages.length === 0) area.innerHTML = `<div class="text-center text-gray-400 text-sm py-8"><i class="fas fa-comments text-3xl mb-2 block text-gray-300"></i>まだメッセージはありません。最初のメッセージを送ってみましょう。</div>`;
      messages.forEach(m => appendMessage(m));
      area.scrollTop = area.scrollHeight;
    }

    function renderFile(msg) {
      if (!msg.fileUrl) return "";
      if (msg.fileType === "image") return `<a href="${msg.fileUrl}" target="_blank"><img src="${msg.fileUrl}" class="rounded-xl max-w-[220px] max-h-[180px] object-cover mt-2 border border-white/20" /></a>`;
      return `<a href="${msg.fileUrl}" target="_blank" class="flex items-center gap-2 mt-2 underline text-sm opacity-80"><i class="fas fa-file-download"></i>${escapeHtml(msg.fileName || "添付ファイル")}</a>`;
    }

    function appendMessage(msg) {
      const area = document.getElementById("messagesArea");
      const isMySide = me.role === "admin" ? msg.senderRole === "admin" : msg.senderRole === "user";
      const isOwner = me && msg.senderId && msg.senderId.toString() === me._id.toString();
      const canDelete = isOwner || me.role === "admin";
      const time = new Date(msg.createdAt).toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit" });
      const wrap = document.createElement("div");
      wrap.className = `msg-wrap flex ${isMySide ? "justify-end" : "justify-start"} items-end gap-2`;
      wrap.dataset.msgId = msg._id;
      if (msg.deleted) { wrap.innerHTML = `<p class="text-xs text-gray-300 italic px-4 py-1">このメッセージは削除されました</p>`; area.appendChild(wrap); return; }
      const liked = me && (msg.likes || []).some(l => l.userId === me._id.toString());
      const likeCount = (msg.likes || []).length;
      const likeColor = liked ? "text-blue-500" : (isMySide ? "text-white/60 hover:text-white" : "text-gray-400 hover:text-blue-500");
      const likeBtn = `<button class="like-btn ${likeColor} text-xs flex items-center gap-1 transition-colors" onclick="toggleLike('${msg._id}')"><i class="fas fa-thumbs-up"></i>${likeCount > 0 ? `<span>${likeCount}</span>` : ""}</button>`;
      const editBtn = (isOwner && msg.message && !msg.fileUrl) ? `<button class="text-gray-300 hover:text-blue-500 text-xs" onclick="openEdit('${msg._id}',this)" title="編集"><i class="fas fa-pen"></i></button>` : "";
      const delBtn = canDelete ? `<button class="text-gray-300 hover:text-red-400 text-xs" onclick="deleteMessage('${msg._id}')" title="削除"><i class="fas fa-trash-alt"></i></button>` : "";
      const textHtml = msg.message ? `<p class="break-words">${escapeHtml(msg.message)}</p>` : "";
      const editedBadge = msg.edited ? `<span class="text-xs opacity-50 ml-1">(編集済)</span>` : "";
      if (!isMySide) {
        wrap.innerHTML = `<div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center shrink-0"><i class="fas fa-user-tie text-white text-xs"></i></div>
          <div class="max-w-[75%]"><p class="text-xs text-gray-400 mb-1">${msg.senderName}</p>
          <div class="bg-white border border-gray-100 rounded-2xl rounded-bl-sm px-4 py-2.5 shadow-sm text-sm text-gray-800">${textHtml}${renderFile(msg)}${editedBadge}</div>
          <div class="flex items-center gap-2 mt-1"><p class="text-xs text-gray-300">${time}</p>${likeBtn}<div class="msg-actions flex items-center gap-1.5">${editBtn}${delBtn}</div></div></div>`;
      } else {
        wrap.innerHTML = `<div class="max-w-[75%] text-right">
          <div class="bg-blue-700 text-white rounded-2xl rounded-br-sm px-4 py-2.5 shadow-sm text-sm inline-block text-left">${textHtml}${renderFile(msg)}${editedBadge}</div>
          <div class="flex items-center justify-end gap-2 mt-1"><div class="msg-actions flex items-center gap-1.5">${editBtn}${delBtn}</div>${likeBtn}<p class="text-xs text-gray-300">${time}</p></div></div>`;
      }
      area.appendChild(wrap);
    }

    function handleFileSelect(e) {
      const file = e.target.files[0]; if (!file) return;
      pendingFile = file;
      document.getElementById("filePreviewName").textContent = file.name;
      document.getElementById("filePreviewBar").classList.remove("hidden");
    }
    function clearFile() {
      pendingFile = null;
      document.getElementById("fileInput").value = "";
      document.getElementById("filePreviewBar").classList.add("hidden");
    }

    async function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text && !pendingFile) return;
      if (!currentRoom) return;
      let fileUrl = null, fileName = null, fileType = null;
      if (pendingFile) {
        const fd = new FormData(); fd.append("file", pendingFile);
        const up = await fetch("/api/chat/upload", { method:"POST", body:fd });
        const upData = await up.json();
        fileUrl = upData.fileUrl; fileName = upData.fileName; fileType = upData.fileType;
        clearFile();
      }
      socket.emit("sendMessage", {
        applicationId: currentRoom,
        applicationType: document.querySelector(`#roomSelector option[value="${currentRoom}"]`)?.dataset.type || currentType || "newgrad",
        senderId: me._id, senderName: `${me.lastName||""}${me.firstName||me.username}`, senderRole: me.role,
        message: text, fileUrl, fileName, fileType
      });
      input.value = "";
    }

    async function toggleLike(messageId) { await fetch(`/api/chat/message/${messageId}/like`, { method:"POST" }); }

    function openEdit(messageId, btn) {
      editingMessageId = messageId;
      const bubble = btn.closest(".msg-wrap").querySelector("p.break-words");
      document.getElementById("editInput").value = bubble ? bubble.textContent : "";
      document.getElementById("editModal").classList.remove("hidden");
    }
    function closeEdit() { editingMessageId = null; document.getElementById("editModal").classList.add("hidden"); }
    async function submitEdit() {
      const newText = document.getElementById("editInput").value.trim();
      if (!newText || !editingMessageId) return;
      await fetch(`/api/chat/message/${editingMessageId}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ message:newText }) });
      closeEdit();
    }
    async function deleteMessage(messageId) {
      if (!confirm("このメッセージを削除しますか？")) return;
      await fetch(`/api/chat/message/${messageId}`, { method:"DELETE" });
    }

    socket.on("newMessage", (msg) => {
      if (msg.applicationId !== currentRoom) return;
      const area = document.getElementById("messagesArea");
      const empty = area.querySelector(".text-center"); if (empty) empty.remove();
      appendMessage(msg); area.scrollTop = area.scrollHeight;
    });
    socket.on("messageLiked", ({ messageId, likes }) => {
      const wrap = document.querySelector(`.msg-wrap[data-msg-id="${messageId}"]`); if (!wrap) return;
      const liked = me && likes.some(l => l.userId === me._id.toString());
      const isMySide = wrap.classList.contains("justify-end");
      const color = liked ? "text-blue-500" : (isMySide ? "text-white/60 hover:text-white" : "text-gray-400 hover:text-blue-500");
      const btn = wrap.querySelector(".like-btn");
      if (btn) { btn.className = `like-btn ${color} text-xs flex items-center gap-1 transition-colors`; btn.innerHTML = `<i class="fas fa-thumbs-up"></i>${likes.length > 0 ? `<span>${likes.length}</span>` : ""}`; }
    });
    socket.on("messageEdited", ({ messageId, message }) => {
      const wrap = document.querySelector(`.msg-wrap[data-msg-id="${messageId}"]`); if (!wrap) return;
      const bubble = wrap.querySelector("p.break-words"); if (bubble) bubble.textContent = message;
      if (!wrap.querySelector(".opacity-50")) { const d = wrap.querySelector(".bg-white,.bg-blue-700"); if (d) d.insertAdjacentHTML("beforeend", `<span class="text-xs opacity-50 ml-1">(編集済)</span>`); }
    });
    socket.on("messageDeleted", ({ messageId }) => {
      const wrap = document.querySelector(`.msg-wrap[data-msg-id="${messageId}"]`); if (!wrap) return;
      wrap.innerHTML = `<p class="text-xs text-gray-300 italic px-4 py-1">このメッセージは削除されました</p>`;
    });

    document.getElementById("msgInput").addEventListener("keydown", (e) => { if (e.key==="Enter"&&!e.shiftKey) { e.preventDefault(); sendMessage(); } });
    function escapeHtml(str) { if (!str) return ""; return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    init();
  </script>
</body>
</html>
